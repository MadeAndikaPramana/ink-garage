<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4efe6" />
    <meta name="description" content="Ink Garage Tattoo Studio — tattoos, piercing, nail art and coffee in Canggu, Bali. Book via WhatsApp." />
    <title>Ink Garage Tattoo Studio — Canggu, Bali</title>

    <!-- Static social-preview tags (this is a client-rendered SPA, so link
         previews always show these). TODO: add an absolute og:image / og:url
         once the real domain and a share image exist. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ink Garage Tattoo Studio" />
    <meta property="og:title" content="Ink Garage Tattoo Studio — Canggu, Bali" />
    <meta property="og:description" content="Ink, coffee, piercing and nail art in Canggu. Book via WhatsApp." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ink Garage Tattoo Studio — Canggu, Bali" />
    <meta name="twitter:description" content="Ink, coffee, piercing and nail art in Canggu. Book via WhatsApp." />

    <!-- LocalBusiness structured data. Address/phone/rating come from the
         public Google Maps listing (Sept 2026), unverified with the owner.
         TODO(owner): confirm address and opening hours before launch. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "TattooParlor",
        "name": "Ink Garage Tattoo Studio",
        "telephone": "+62 821-2222-699",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Jl. Raya Canggu No.162A",
          "addressLocality": "Canggu, Kuta Utara",
          "addressRegion": "Bali",
          "postalCode": "80351",
          "addressCountry": "ID"
        },
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "5.0",
          "reviewCount": "113",
          "bestRating": "5"
        },
        "sameAs": ["https://www.instagram.com/inkgaragetattoostudio/"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
